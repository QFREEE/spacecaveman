<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find a time to catch up in NYC.">
  <title>NYC visits · Space Caveman</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><a class="brand" href="/">spacecaveman</a><span>Westchester ↔ NYC</span></header>
  <main>
    <section class="intro" aria-labelledby="title">
      <h1 id="title">NYC visits</h1>
      <p class="notice">Visit plans are private. <a href="/#nyc">Current NYC status</a></p>
    </section>
    <section aria-labelledby="visits-title">
      <div class="section-heading"><h2 id="visits-title">Upcoming visits</h2><span>All times Eastern</span></div>
      <div class="filters" role="group" aria-label="Filter visits">
        <button type="button" data-filter="all" aria-pressed="true">All visits</button>
        <button type="button" data-filter="confirmed" aria-pressed="false">Confirmed</button>
        <button type="button" data-filter="tentative" aria-pressed="false">Tentative</button>
      </div>
      <p id="load-status" role="status">Loading visits…</p>
      <button id="retry" type="button" hidden>Try again</button>
      <div id="visits" aria-label="Visit list"></div>
      <noscript><p>Enable JavaScript to load upcoming visits.</p></noscript>
    </section>
  </main>
</body>
</html>
